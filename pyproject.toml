readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "pangu>=4.0.6.1",
    "peft>=0.10.0",
    "trl>=0.12.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "torchao>=0.16.0",
    "gguf>=0.10.0",
]
